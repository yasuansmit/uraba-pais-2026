{% extends "base.html" %}

{% block content %}
<div class="card border-0 shadow-sm rounded-4 bg-white p-4 max-w-4xl mx-auto">
    <h4 class="fw-bold text-dark mb-4"><i class="bi bi-person-plus-fill text-primary me-2"></i>Registro de Nuevo Beneficiario</h4>

    <form action="{{ url_for('crear_beneficiario') }}" method="POST">
        <div class="row g-3 mb-3">
            <div class="col-md-4">
                <label class="form-label fw-semibold">Código Interno</label>
                <input type="text" name="codigo_interno" class="form-control rounded-3" value="{{ codigo_sugerido }}" required>
            </div>
            <div class="col-md-4">
                <label class="form-label fw-semibold">Tipo de Documento</label>
                <select name="tipo_doc" class="form-select rounded-3" required>
                    <option value="Cédula de Ciudadanía" {% if tipo_doc == 'Cédula de Ciudadanía' %}selected{% endif %}>Cédula de Ciudadanía</option>
                    <option value="Tarjeta de Identidad" {% if tipo_doc == 'Tarjeta de Identidad' %}selected{% endif %}>Tarjeta de Identidad</option>
                    <option value="Cédula de Extranjería" {% if tipo_doc == 'Cédula de Extranjería' %}selected{% endif %}>Cédula de Extranjería</option>
                    <option value="PPT" {% if tipo_doc == 'PPT' %}selected{% endif %}>PPT</option>
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label fw-semibold">Número de Documento</label>
                <input type="text" name="num_doc" class="form-control rounded-3" value="{{ num_doc }}" maxlength="10" required>
            </div>
        </div>

        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <label class="form-label fw-semibold">Nombres</label>
                <input type="text" name="nombres" class="form-control rounded-3" required>
            </div>
            <div class="col-md-6">
                <label class="form-label fw-semibold">Apellidos</label>
                <input type="text" name="apellidos" class="form-control rounded-3">
            </div>
        </div>

        <div class="row g-3 mb-3">
            <div class="col-md-4">
                <label class="form-label fw-semibold">Fecha de Nacimiento</label>
                <input type="date" name="fecha_nacimiento" class="form-control rounded-3">
            </div>
            <div class="col-md-4">
                <label class="form-label fw-semibold">Sexo</label>
                <select name="sexo" class="form-select rounded-3">
                    <option value="Masculino">Masculino</option>
                    <option value="Femenino">Femenino</option>
                    <option value="Otro">Otro / Intersexual</option>
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label fw-semibold">Teléfono / Celular</label>
                <input type="text" name="telefono" class="form-control rounded-3" maxlength="10">
            </div>
        </div>

        <div class="row g-3 mb-3">
            <div class="col-md-4">
                <label class="form-label fw-semibold">Municipio</label>
                <select name="municipio" class="form-select rounded-3">
                    {% for mun in ['Apartadó', 'Turbo', 'Carepa', 'Chigorodó', 'Necoclí', 'Arboletes', 'San Pedro de Urabá', 'San Juan de Urabá', 'Mutatá', 'Murindó', 'Vigía del Fuerte', 'Otro'] %}
                    <option value="{{ mun }}" {% if (municipio_sel and municipio_sel.lower() == mun.lower()) or (not municipio_sel and mun == 'Apartadó') %}selected{% endif %}>{{ mun }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label fw-semibold">Condición poblacional</label>
                <select name="condicion_poblacional" class="form-select rounded-3" required>
                    <option value="">Seleccione...</option>
                    {% for c in condiciones %}
                    <option value="{{ c['condicion'] }}" {% if condicion_sel and (condicion_sel.lower() in c['condicion'].lower() or c['condicion'].lower() in condicion_sel.lower()) %}selected{% endif %}>{{ c['condicion'] }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label fw-semibold">Discapacidad</label>
                <select name="discapacidad" class="form-select rounded-3" required>
                    <option value="">Seleccione...</option>
                    {% for d in discapacidades %}
                    <option value="{{ d['discapacidad'] }}" {% if discapacidad_sel and (discapacidad_sel.lower() in d['discapacidad'].lower() or d['discapacidad'].lower() in discapacidad_sel.lower()) %}selected{% endif %}>{{ d['discapacidad'] }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" name="habeas_data" id="habeasData" checked>
            <label class="form-check-label fs-7 text-muted" for="habeasData">
                Autorizo el tratamiento de datos personales conforme a la ley de protección de datos (Habeas Data).
            </label>
        </div>

        <div class="d-flex justify-content-end gap-2">
            <a href="{{ url_for('listar_beneficiarios') }}" class="btn btn-light rounded-3">Cancelar</a>
            <button type="submit" class="btn btn-primary rounded-3"><i class="bi bi-save me-1"></i> Guardar Registro</button>
        </div>
    </form>
</div>
{% endblock %}
