{% extends "base.html" %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div class="card border-0 shadow-sm rounded-4 bg-white p-4">
                <div class="d-flex align-items-center justify-content-between mb-4 pb-3 border-bottom">
                    <h4 class="fw-bold text-dark mb-0">Editar Beneficiario: {{ b.nombres }} {{ b.apellidos }}</h4>
                    <a href="{{ url_for('ficha_beneficiario', id=b.id) }}" class="btn btn-light rounded-pill px-3 fs-7 fw-bold">
                        <i class="bi bi-arrow-left me-1"></i> Cancelar / Volver a la Ficha
                    </a>
                </div>

                <form action="{{ url_for('editar_beneficiario', id=b.id) }}" method="POST">
                    <div class="row g-3 mb-3">
                        <div class="col-md-4">
                            <label class="form-label fw-bold fs-7">Tipo de Documento</label>
                            <select name="tipo_doc" class="form-select bg-light border-0 fs-7" required>
                                <option value="Cédula de Ciudadanía" {% if b.tipo_doc == 'Cédula de Ciudadanía' %}selected{% endif %}>Cédula de Ciudadanía</option>
                                <option value="Tarjeta de Identidad" {% if b.tipo_doc == 'Tarjeta de Identidad' %}selected{% endif %}>Tarjeta de Identidad</option>
                                <option value="Cédula de Extranjería" {% if b.tipo_doc == 'Cédula de Extranjería' %}selected{% endif %}>Cédula de Extranjería</option>
                                <option value="PPT" {% if b.tipo_doc == 'PPT' %}selected{% endif %}>PPT</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold fs-7">Número de Documento</label>
                            <input type="text" name="num_doc" value="{{ b.num_doc }}" class="form-control bg-light border-0 fs-7" maxlength="10" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold fs-7">Código Interno</label>
                            <input type="text" name="codigo_interno" value="{{ b.codigo_interno }}" class="form-control bg-light border-0 fs-7">
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold fs-7">Nombres *</label>
                            <input type="text" name="nombres" value="{{ b.nombres }}" class="form-control bg-light border-0 fs-7" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold fs-7">Apellidos *</label>
                            <input type="text" name="apellidos" value="{{ b.apellidos }}" class="form-control bg-light border-0 fs-7" required>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-4">
                            <label class="form-label fw-bold fs-7">Fecha Nacimiento</label>
                            <input type="date" name="fecha_nacimiento" value="{{ b.fecha_nacimiento }}" class="form-control bg-light border-0 fs-7">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold fs-7">Sexo / Género</label>
                            <select name="sexo" class="form-select bg-light border-0 fs-7">
                                <option value="Masculino" {% if b.sexo == 'Masculino' %}selected{% endif %}>Masculino</option>
                                <option value="Femenino" {% if b.sexo == 'Femenino' %}selected{% endif %}>Femenino</option>
                                <option value="Otro" {% if b.sexo == 'Otro' %}selected{% endif %}>Otro / Intersexual</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold fs-7">Teléfono</label>
                            <input type="text" name="telefono" value="{{ b.telefono or '' }}" class="form-control bg-light border-0 fs-7" maxlength="10">
                        </div>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-4">
                            <label class="form-label fw-bold fs-7">Municipio</label>
                            <select name="municipio" class="form-select bg-light border-0 fs-7">
                                <option value="Apartadó" {% if b.municipio == 'Apartadó' %}selected{% endif %}>Apartadó</option>
                                <option value="Turbo" {% if b.municipio == 'Turbo' %}selected{% endif %}>Turbo</option>
                                <option value="Carepa" {% if b.municipio == 'Carepa' %}selected{% endif %}>Carepa</option>
                                <option value="Chigorodó" {% if b.municipio == 'Chigorodó' %}selected{% endif %}>Chigorodó</option>
                                <option value="Necoclí" {% if b.municipio == 'Necoclí' %}selected{% endif %}>Necoclí</option>
                                <option value="Arboletes" {% if b.municipio == 'Arboletes' %}selected{% endif %}>Arboletes</option>
                                <option value="San Pedro de Urabá" {% if b.municipio == 'San Pedro de Urabá' %}selected{% endif %}>San Pedro de Urabá</option>
                                <option value="San Juan de Urabá" {% if b.municipio == 'San Juan de Urabá' %}selected{% endif %}>San Juan de Urabá</option>
                                <option value="Otro" {% if b.municipio == 'Otro' %}selected{% endif %}>Otro</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold fs-7">Condición poblacional</label>
                            <select name="condicion_poblacional" class="form-select bg-light border-0 fs-7" required>
                                <option value="">Seleccione...</option>
                                {% for c in condiciones %}
                                <option value="{{ c['condicion'] }}" {% if b.condicion_poblacional == c['condicion'] %}selected{% endif %}>{{ c['condicion'] }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold fs-7">Discapacidad</label>
                            <select name="discapacidad" class="form-select bg-light border-0 fs-7" required>
                                <option value="">Seleccione...</option>
                                {% for d in discapacidades %}
                                <option value="{{ d['discapacidad'] }}" {% if b.discapacidad == d['discapacidad'] %}selected{% endif %}>{{ d['discapacidad'] }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="form-check mb-4">
                        <input class="form-check-input" type="checkbox" name="habeas_data" id="habeasData" {% if b.habeas_data %}checked{% endif %}>
                        <label class="form-check-label fs-7 text-muted" for="habeasData">
                            Autorizo el tratamiento de datos personales conforme a la ley de protección de datos (Habeas Data).
                        </label>
                    </div>

                    <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                        <button type="submit" class="btn btn-primary rounded-pill px-5 py-2 fw-bold">Guardar Cambios</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
